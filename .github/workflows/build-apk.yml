name: Build Light-speed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.lightspeed .

      - name: Fetch V2Ray Box build helper
        run: |
          git clone --depth 1 https://github.com/imanheidary/v2box.git /tmp/v2box
          mkdir -p scripts
          cp /tmp/v2box/example/scripts/build_android_libxray.sh scripts/build_android_libxray.sh
          chmod +x scripts/build_android_libxray.sh

      - name: Build libXray Android core
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go python3 python3-pip jq unzip zip
          # Pin a libXray release whose nodep.CallResponse API matches v2ray_box.
          # Do not build libXray main: its newer API removed CallResponse[T].
          ./scripts/build_android_libxray.sh --project-root "$GITHUB_WORKSPACE" --libxray-ref v26.3.27 --android-abis arm64-v8a,x86_64

      - name: Configure Android packaging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled = true', 1)
          s = s.replace('android {', 'android {\n    packaging {\n        jniLibs { useLegacyPackaging = true }\n    }', 1)
          p.write_text(s)
          PY
          mkdir -p android/app/libs

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Light-speed-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
